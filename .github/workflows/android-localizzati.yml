name: APK FireOps Localizzati

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-localizzati.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila l'APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Rinomina
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FireOps-Localizzati.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FireOps-Localizzati-apk
          path: FireOps-Localizzati.apk

      - name: Pubblica nella release "apk-localizzati" (link fisso per scaricare dal telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-localizzati
          name: FireOps Localizzati (APK)
          body: Scarica FireOps-Localizzati.apk dal telefono e installalo (serve consentire l'installazione da questa fonte).
          files: FireOps-Localizzati.apk
