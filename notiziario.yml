name: Notiziario

# Ogni 20 minuti, più un avvio a mano dalla scheda Actions.
# GitHub non garantisce il minuto esatto: sotto carico la cron slitta di
# qualche minuto, e per un notiziario va benissimo.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

# Un solo aggiornamento per volta: due job che committano lo stesso file
# nello stesso momento si respingerebbero a vicenda.
concurrency:
  group: notiziario
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-save fast-xml-parser

      - name: Aggrega i feed
        run: node tools/notiziario.mjs

      - name: Committa se è cambiato qualcosa
        run: |
          if git diff --quiet -- db/notiziario.json; then
            echo "Nessuna notizia nuova."
            exit 0
          fi
          git config user.name  "notiziario-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db/notiziario.json
          git commit -m "Notiziario: aggiornamento automatico"
          # La cron può accavallarsi con un tuo push: si riallinea e riprova
          # invece di fallire il job.
          git pull --rebase --autostash
          git push