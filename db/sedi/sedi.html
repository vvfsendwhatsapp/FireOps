<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FireOps VVF - Sedi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1d2228; --muted:#68717c; --line:#dfe3e8;
  --head:#22272e; --headink:#fff; --accent:#c8102e; --chip:#eef0f3;
  --ok:#1f9d55; --warn:#e0a800; --ko:#5c6670;
  --t-permanente:#c8102e; --t-volontario:#e8790c; --t-aeroportuale:#1f6fd1;
  --t-direzione:#1d3557; --t-centrale:#7a0019; --t-portuale:#0f9aa8; --t-rurale:#3a8c2f; --t-stagionale:#c2185b; --t-sommozzatori:#283593; --t-volo:#5d4037; --t-tlc:#9e9d24; --t-presidio:#7b4bc4; --t-didattico:#b8860b; --t-altro:#7a828c;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#15181c; --panel:#1e2228; --ink:#e7eaee; --muted:#9aa3ad; --line:#2f353d;
  --head:#0f1114; --chip:#2a2f36;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
button,select,input,textarea{font:inherit;color:inherit}

header{background:var(--head);color:var(--headink);display:flex;align-items:center;gap:10px;
  padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
header a.home{color:#fff;text-decoration:none;font-size:20px;line-height:1;padding:4px 8px;border-radius:6px;background:#ffffff14}
header h1{font-size:16px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 b{color:#ff5a6e;font-weight:600}
#count{font-size:12px;background:#ffffff1f;padding:3px 8px;border-radius:99px;white-space:nowrap}
#sync{font-size:12px;padding:3px 8px;border-radius:99px;border:0;cursor:pointer;background:#ffffff1f;color:#fff;white-space:nowrap}
#sync.pend{background:var(--warn);color:#1d2228}
#sync.err{background:var(--accent)}

.bar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar input[type=search]{flex:1 1 180px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.bar select{flex:1 1 130px;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.reset{color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--chip);border:1px solid transparent;cursor:pointer;white-space:nowrap;font-size:13px;user-select:none}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.off{opacity:.4;text-decoration:line-through}
.chip small{color:var(--muted)}
.chips .sep{width:1px;background:var(--line);flex:none;margin:2px 4px}

main{flex:1;display:flex;min-height:0;position:relative}
#list{width:360px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
#map{flex:1;min-height:0}
#map.adding{cursor:crosshair}
.item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px}
.item:hover,.item.sel{background:var(--chip)}
.item .dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:4px}
.item .n{font-weight:600}
.item .s{color:var(--muted);font-size:12px}
.item .d{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;text-align:right}
.st{font-size:11px;font-weight:600;white-space:nowrap}
.st.convalidata,.st.nuova{color:var(--ok)} .st.da_correggere{color:var(--warn)} .st.non_vvf,.st.chiusa{color:var(--ko)}
.more{display:block;width:calc(100% - 24px);margin:10px 12px}
.empty{padding:24px 12px;color:var(--muted);text-align:center}

/* scheda convalida */
#panel{position:absolute;top:0;right:0;bottom:0;width:390px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);
  z-index:1200;display:none;flex-direction:column;box-shadow:-4px 0 16px #0002}
#panel.open{display:flex}
#panel .ph{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
#panel .ph h2{font-size:16px;margin:2px 0 0;line-height:1.25}
#panel .ph .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
#panel .pb{overflow-y:auto;padding:12px 14px;flex:1}
#panel .pf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.tag{display:inline-block;color:#fff;font-size:11px;padding:1px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.info div{margin:2px 0}
.k{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.acts a,.acts button{font-size:12px;padding:6px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);text-decoration:none;cursor:pointer;color:var(--ink)}
.acts a.nav{background:var(--accent);border-color:var(--accent);color:#fff}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 6px}
.quick button{padding:9px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;font-size:13px}
.quick button.ok{background:var(--ok);border-color:var(--ok);color:#fff;grid-column:1 / -1}
.quick button.sel{outline:2px solid var(--ink);outline-offset:1px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px;font-weight:600}
.f{display:grid;grid-template-columns:96px 1fr;gap:6px 8px;align-items:center}
.f label{color:var(--muted);font-size:13px}
.f input,.f select,.f textarea{width:100%;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.f input.chg,.f select.chg,.f textarea.chg{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--bg))}
.f textarea{resize:vertical;min-height:54px}
.pos{display:flex;gap:6px;align-items:center}
.pos code{font-size:12px;flex:1}
.pos button{font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.pos button.on{background:var(--warn);border-color:var(--warn);color:#1d2228}
.hist{font-size:12px;color:var(--muted);margin:0;padding-left:16px}
.hist li{margin:2px 0}
.btn.save{background:var(--ink);color:var(--panel);border-color:var(--ink);flex:1;font-weight:600}
.btn.save:disabled{opacity:.4;cursor:default}
.note{font-size:12px;color:var(--muted);margin-top:8px}

.tabs{display:none}
@media (max-width:760px){
  #list{position:absolute;inset:0;width:auto;border:0;z-index:1100;display:none}
  .bar{gap:6px;padding:8px}
  .bar input[type=search]{order:1;flex:1 1 120px}
  #near{order:2} #add{order:3} #reset{order:4}
  .bar select{order:5;flex:1 1 100px}
  #csv{order:8}
  .bar .lbl{display:none}
  main.showlist #list{display:block}
  .tabs{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;padding:10px;border:0;background:none;font-weight:600;color:var(--muted)}
  .tabs button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
  #panel{position:fixed;top:auto;left:0;right:0;bottom:0;width:auto;max-height:82dvh;border-left:0;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;box-shadow:0 -6px 24px #0004;z-index:1300}
  #panel .ph::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
  #panel .ph{position:relative;padding-top:16px}
  #count{display:none}
  #panel.mini .pb,#panel.mini .pf{display:none}
  #panel.mini .ph .k{display:none}
}
#pfatto{display:none;margin-left:auto;align-self:center}
#panel.mini #pfatto{display:inline-block}
#panel.mini .x{display:none}

.pin{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0006,0 1px 3px #0008;position:relative}
.pin.convalidata,.pin.nuova{box-shadow:0 0 0 3px var(--ok),0 1px 3px #0008}
.pin.da_correggere{box-shadow:0 0 0 3px var(--warn),0 1px 3px #0008}
.pin.non_vvf,.pin.chiusa{opacity:.55;box-shadow:0 0 0 2px var(--ko)}
.pin.sel{transform:scale(1.5)}
.me{width:16px;height:16px;border-radius:50%;background:#1f6fd1;border:3px solid #fff;box-shadow:0 0 0 6px #1f6fd140}
#msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1400;background:var(--head);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none;max-width:90%;text-align:center}
/* anteprima Street View */
.sv{margin:10px 0 2px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--chip);position:relative}
.sv iframe{display:block;width:100%;height:210px;border:0}
.sv .svbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 8px;background:var(--panel);border-top:1px solid var(--line)}
.sv .svbar a{color:var(--ink)}
@media (max-width:760px){ .sv iframe{height:180px} }
/* comandi conclusi e ricerca indirizzo */
#concl{display:none}
#concl.vis{display:inline-block}
#concl.fatto{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.concl.on{background:var(--ok);color:#fff}
#geo{position:absolute;top:10px;left:56px;right:56px;max-width:420px;z-index:1250;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 4px 16px #0003;padding:8px;display:none}
#geo.open{display:block}
#geo .r{display:flex;gap:6px}
#geo input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#geo .k{font-size:12px;margin:6px 2px 0}
.georis{list-style:none;margin:6px 0 0;padding:0;max-height:240px;overflow-y:auto}
.georis li{padding:7px 8px;border-radius:6px;cursor:pointer;font-size:13px;line-height:1.3;border-bottom:1px solid var(--line)}
.georis li:hover{background:var(--chip)}
.georis li small{display:block;color:var(--muted);font-size:11px}
.f .georis{grid-column:1 / -1;margin:0 0 4px;border:1px solid var(--line);border-radius:8px}
@media (max-width:760px){ #geo{left:8px;right:8px;max-width:none} }
footer{font-size:11px;color:var(--muted);padding:4px 12px;background:var(--panel);border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <a class="home" href="./" title="Home FireOps">⌂</a>
  <h1>FireOps VVF - <b>Sedi</b></h1>
  <span id="count">…</span>
  <button id="sync" title="Stato salvataggio correzioni">…</button>
</header>

<div class="bar">
  <input type="search" id="q" placeholder="Cerca nome, comune, via…" autocomplete="off">
  <select id="reg"><option value="">Tutte le regioni</option></select>
  <select id="prov"><option value="">Tutte le province</option></select>
  <select id="stato" title="Filtra per stato di convalida">
    <option value="">Tutti gli stati</option>
    <option value="da_conv">Da convalidare</option>
    <option value="convalidata">Convalidate (anche aggiunte a mano)</option>
    <option value="da_correggere">Da correggere</option>
    <option value="nuova">Aggiunte a mano</option>
    <option value="scartate">Scartate (non VVF / chiuse)</option>
  </select>
  <button class="btn" id="near" title="Ordina per distanza dalla mia posizione">📍<span class="lbl"> Vicino a me</span></button>
  <button class="btn" id="add" title="Aggiungi una sede che manca">＋<span class="lbl"> Sede</span></button>
  <button class="btn" id="csv" title="Scarica le sedi filtrate in CSV">⬇<span class="lbl"> CSV</span></button>
  <button class="btn" id="concl" title="Segna il Comando come concluso: tutte le sedi controllate">🏁</button>
  <button class="btn reset" id="reset">Reset dati</button>
</div>
<div class="chips" id="chips"></div>

<main id="main">
  <div id="list"></div>
  <div id="map"></div>
  <aside id="panel"></aside>
  <div id="geo"><div class="r"><input type="search" id="geoq" placeholder="Indirizzo o luogo della nuova sede" autocomplete="off" enterkeyhint="search">
    <button class="btn" id="geogo">🔍</button><button class="btn" id="geox" title="Annulla">×</button></div>
    <div class="k">…oppure tocca la mappa nel punto esatto</div><ul class="georis" id="georis"></ul></div>
  <div id="msg"></div>
</main>
<nav class="tabs" id="tabs">
  <button data-v="map" class="on">Mappa</button>
  <button data-v="list">Elenco</button>
</nav>
<footer>Dati © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> · <span id="upd"></span> · tipologia stimata dal nome, da verificare</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="../../fireops-sfondi.js"></script>
<script>
(() => {
// ============================== CONFIGURAZIONE ==============================
// URL della Web App Apps Script (Distribuisci > Nuova distribuzione > App web).
// Vuoto = modalita' locale: le correzioni restano nel browser e si esportano col pulsante in alto.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx41BHi8iOF-FBDTT9lRyCUpRtlBQoXnXb_Kg7jJFj5s0a3HDiUTzAh7fQyQeeVUu2s/exec';
// Deve coincidere con TOKEN nello script Apps Script.
const TOKEN = 'cambia-questo-token';
// Facoltativa: chiave Google "Maps Embed API" (gratuita) per l'anteprima Street View ufficiale.
// Vuota = anteprima senza chiave (funziona quasi sempre, ma e' un formato non ufficiale di Google).
const GOOGLE_MAPS_KEY = '';
// ============================================================================

// La pagina funziona sia nella root del repo sia dentro db/sedi/ (o altre sottocartelle).
const DATA_CANDIDATI = ['sedi_vvf.geojson', 'db/sedi/sedi_vvf.geojson', '../db/sedi/sedi_vvf.geojson', '../../db/sedi/sedi_vvf.geojson'];
let DATA_URL = DATA_CANDIDATI[0];
const ROOT = location.pathname.includes('/db/') ? location.pathname.split('/db/')[0] + '/' : './';
const STORE = 'fireops-sedi-v1', CODA = 'fireops-sedi-coda-v1', UTENTE = 'fireops-sedi-utente';

const TIPI = {
  direzione:'Direzione regionale', centrale:'Sede centrale', permanente:'Permanente', volontario:'Volontario', aeroportuale:'Aeroportuale',
  portuale:'Portuale', rurale:'Rurale', stagionale:'Sede stagionale', sommozzatori:'Sommozzatori', volo:'Reparto volo', tlc:'Telecomunicazioni', presidio:'Presidio', didattico:'Polo didattico', altro:'Altro / da verificare'
};
const STATI = {
  '': 'Da convalidare', convalidata: 'Convalidata', da_correggere: 'Da correggere',
  non_vvf: 'Non è una sede VVF', chiusa: 'Chiusa / dismessa', nuova: 'Aggiunta a mano'
};
const CAMPI = ['nome', 'tipo', 'comune', 'via', 'telefono'];
// Nome standard: "Vigili del fuoco - {Tipologia} di {Comune}" (stessa regola di script/sedi.py)
const NOME_TIPO = {
  direzione: 'Direzione regionale', centrale: 'Sede centrale', permanente: 'Distaccamento', volontario: 'Distaccamento volontario',
  aeroportuale: 'Distaccamento aeroportuale', portuale: 'Distaccamento portuale', rurale: 'Presidio rurale',
  stagionale: 'Sede stagionale', sommozzatori: 'Nucleo sommozzatori', volo: 'Reparto volo',
  tlc: 'Nucleo telecomunicazioni', presidio: 'Presidio', didattico: 'Polo didattico', altro: 'Sede'
};
// la Direzione regionale prende il nome della regione: "Vigili del fuoco - Direzione regionale Veneto"
const nomeAuto = (tipo, comune, regione) => 'Vigili del fuoco - ' + (NOME_TIPO[tipo] || 'Sede') +
  (tipo === 'direzione' ? (regione ? ' ' + regione : '') : (comune ? ' di ' + comune : ''));
let nomeManuale = false;
const css = getComputedStyle(document.documentElement);
const COL = Object.fromEntries(Object.keys(TIPI).map(t => [t, css.getPropertyValue('--t-' + t).trim()]));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const ITALIA = [[36.4, 6.6], [47.1, 18.6]];
const map = L.map('map', {zoomControl: true}).fitBounds(ITALIA);
const base = {
  'Stradale': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}),
  // la foto satellitare non ha scritte: sopra metto i livelli "riferimento" di Esri (strade con i nomi, comuni, confini)
  'Satellite': L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19, attribution: 'Esri World Imagery'}),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19}),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19})
  ])
};
base['Stradale'].addTo(map);
// selettore sfondi condiviso di FireOps (sfondo + uno in trasparenza); ripiego: il vecchio controllo
if (!(window.FireOpsSfondi && FireOpsSfondi.aggiungi(map, {sostituisci: [base['Stradale']], posizione: 'topright'})))
  L.control.layers(base, null, {position: 'topright'}).addTo(map);
L.control.scale({imperial: false}).addTo(map);
const cluster = L.markerClusterGroup({showCoverageOnHover: false, maxClusterRadius: 45, disableClusteringAtZoom: 15, chunkedLoading: true});
map.addLayer(cluster);

let SEDI = [], PER_CHIAVE = new Map();
let PROV = {};                         // sigla -> {provincia, regione}, ricavato dai dati
let REMOTE = [];                       // correzioni lette dal foglio
let CONCLUSI = new Map();              // sigla -> ultima correzione "comando/<sigla>" (stato convalidata = concluso)
let coda = ls.get(CODA, []);           // correzioni non ancora inviate (o tutte, in modalita' locale)
let state = {q: '', reg: '', prov: '', stato: '', off: [], me: null, noConcl: false};
let meMarker = null, shown = [], limit = 200, aperta = null, spostando = false, inviando = false;

function toast(t, ms = 2500) { const m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => m.style.display = 'none', ms); }
function salvaStato() { const {me, ...s} = state; ls.set(STORE, s); }
function titolo(e) { return e.nome || ('Sede senza nome' + (e.comune ? ' – ' + e.comune : '')); }
function luogo(e) { return [e.comune, e.sigla ? '(' + e.sigla + ')' : '', e.regione && !e.comune ? e.regione : ''].filter(Boolean).join(' '); }
function km(a, b, c, d) {
  const R = 6371, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
  const h = Math.sin(x / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtKm(k) { return k < 10 ? k.toFixed(1) + ' km' : Math.round(k) + ' km'; }
function fmtData(t) { const d = new Date(t); return isNaN(d) ? '' : d.toLocaleString('it-IT', {day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit'}); }
function svSrc(lat, lon) {
  return GOOGLE_MAPS_KEY
    ? `https://www.google.com/maps/embed/v1/streetview?key=${encodeURIComponent(GOOGLE_MAPS_KEY)}&location=${lat},${lon}&fov=80`
    : `https://maps.google.com/maps?q=&layer=c&cbll=${lat},${lon}&cbp=11,0,0,0,0&output=svembed`;
}
function svLink(lat, lon) { return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}`; }
const scartata = s => s.stato === 'non_vvf' || s.stato === 'chiusa';
const convalidata = s => s.stato === 'convalidata' || s.stato === 'nuova';   // = flag "convalidata" nel DB

// ---------------------------------------------------------------- sedi e correzioni
function icona(s) {
  return L.divIcon({className: '', html: `<div class="pin ${s.stato || ''} ${aperta === s ? 'sel' : ''}" style="background:${COL[s.e.tipo] || COL.altro}"></div>`, iconSize: [16, 16], iconAnchor: [8, 8]});
}

function creaSede(p, lat, lon) {
  if (!p.tipo || !TIPI[p.tipo]) p.tipo = 'altro';
  const s = {p, lat0: lat, lon0: lon, lat, lon, chiave: p.osm_type + '/' + p.osm_id, storia: [], stato: '', corr: null};
  s.m = L.marker([lat, lon], {icon: L.divIcon({className: ''}), title: ''});
  s.m.on('click', ev => {
    if (map.getContainer().classList.contains('adding')) { map.fire('click', {latlng: ev.latlng}); return; }  // in modalita' aggiungi conta come clic sulla mappa
    apriScheda(s);
  });
  s.m.on('dragend', () => { const ll = s.m.getLatLng(); aggiornaPos(ll.lat, ll.lng); });
  applica(s);
  return s;
}

function applica(s) {
  const c = s.corr;
  s.e = {...s.p};
  s.stato = c ? c.stato || '' : (s.p.stato || '');
  if (c) for (const k of CAMPI) if (c[k] !== undefined && c[k] !== '') s.e[k] = String(c[k]);
  if (c && c.sigla_corretta && PROV[c.sigla_corretta]) {
    s.e.sigla = c.sigla_corretta; s.e.provincia = PROV[c.sigla_corretta].provincia; s.e.regione = PROV[c.sigla_corretta].regione;
  }
  if (c && !c.nome) s.e.nome = nomeAuto(s.e.tipo, s.e.comune, s.e.regione);
  if (!TIPI[s.e.tipo]) s.e.tipo = 'altro';
  const lat = c && parseFloat(c.lat), lon = c && parseFloat(c.lon);
  if (c && isFinite(lat) && isFinite(lon)) { s.lat = lat; s.lon = lon; } else { s.lat = s.lat0; s.lon = s.lon0; }
  s.txt = norm([s.e.nome, s.e.comune, s.e.provincia, s.e.sigla, s.e.via, s.e.operatore].join(' '));
  s.m.setLatLng([s.lat, s.lon]);
  s.m.setIcon(icona(s));
  s.m.options.title = titolo(s.e);
}

// regione/provincia per una sede aggiunta a mano: quelle della sede OSM piu' vicina
function vicina(lat, lon) {
  let best = null, d = 1e9;
  for (const s of SEDI) { if (s.p.osm_type === 'nuova') continue; const k = km(lat, lon, s.lat0, s.lon0); if (k < d) { d = k; best = s; } }
  return best ? best.p : {};
}

function sedeNuova(c) {
  const lat = parseFloat(c.lat), lon = parseFloat(c.lon);
  const v = vicina(lat, lon);
  const p = {osm_type: 'nuova', osm_id: c.chiave.split('/')[1], nome: '', tipo: 'altro', regione: v.regione || '', provincia: v.provincia || '', sigla: v.sigla || '', comune: '', via: '', telefono: '', operatore: ''};
  const s = creaSede(p, lat, lon);
  SEDI.push(s); PER_CHIAVE.set(s.chiave, s);
  return s;
}

function ricalcolaCorrezioni() {
  const tutte = [...REMOTE, ...coda].filter(c => c && c.chiave).sort((a, b) => String(a.timestamp).localeCompare(String(b.timestamp)));
  for (const s of SEDI) { s.corr = null; s.storia = []; }
  CONCLUSI = new Map();
  for (const c of tutte) {
    if (c.chiave.startsWith('comando/')) { CONCLUSI.set(c.chiave.slice(8), c); continue; }
    let s = PER_CHIAVE.get(c.chiave);
    if (!s && c.chiave.startsWith('nuova/')) s = sedeNuova(c);
    if (!s) continue;
    s.storia.push(c); s.corr = c;
  }
  for (const s of SEDI) applica(s);
}

// ---------------------------------------------------------------- server (Apps Script)
async function leggiRemote() {
  if (!APPS_SCRIPT_URL) return;
  try {
    const r = await fetch(APPS_SCRIPT_URL + '?t=' + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error(j.errore || 'risposta non valida');
    REMOTE = j.correzioni || [];
    // tolgo dalla coda cio' che il foglio ha gia' (stesso id)
    const visti = new Set(REMOTE.map(c => c.id));
    const prima = coda.length;
    coda = coda.filter(c => !visti.has(c.id));
    if (coda.length !== prima) ls.set(CODA, coda);
  } catch (e) {
    console.warn('Lettura correzioni fallita', e);
    toast('Correzioni condivise non raggiungibili: uso quelle locali', 3500);
  }
}

// Correzioni che il foglio ha rifiutato in modo esplicito (ok:false): escono dalla coda
// per non bloccare le altre, ma restano qui con il motivo e si possono rimandare.
const RIFIUTATE = 'fireops-sedi-rifiutate-v1';
let ultimoErrore = '';

async function invia() {
  if (!APPS_SCRIPT_URL || inviando || !coda.length) { syncUI(); return; }
  inviando = true; ultimoErrore = ''; syncUI();
  const rifiutate = [];
  try {
    while (coda.length) {
      const c = coda[0];
      let r;
      // senza un limite una richiesta appesa lascia l'invio fermo per sempre
      const ac = new AbortController(), tmo = setTimeout(() => ac.abort(), 30000);
      let testo;
      try {
        r = await fetch(APPS_SCRIPT_URL, {method: 'POST', body: JSON.stringify({...c, token: TOKEN}), signal: ac.signal});
        testo = await r.text();
      } catch (e) {
        throw new Error(e.name === 'AbortError' ? 'il foglio non risponde da 30 secondi' : 'foglio non raggiungibile (' + e.message + ')');
      } finally { clearTimeout(tmo); }
      syncUI();
      let j;
      try { j = JSON.parse(testo); }
      catch (e) { throw new Error('risposta non valida del foglio (HTTP ' + r.status + '): ' + testo.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140)); }
      if (!j.ok) {
        rifiutate.push({...c, motivo_rifiuto: j.errore || 'rifiutata', rifiutata_il: new Date().toISOString()});
        coda.shift(); ls.set(CODA, coda);
        continue;
      }
      REMOTE.push(c); coda.shift(); ls.set(CODA, coda);
    }
  } catch (e) {
    console.warn('Invio fallito', e);
    ultimoErrore = e.message;
    toast('Invio non riuscito: ' + e.message, 8000);
  } finally {
    if (rifiutate.length) {
      ls.set(RIFIUTATE, ls.get(RIFIUTATE, []).concat(rifiutate));
      const motivi = [...new Set(rifiutate.map(x => x.motivo_rifiuto))].join('; ');
      toast(`${rifiutate.length} correzioni rifiutate dal foglio (${motivi}): tenute da parte, clicca il pulsante di stato per i dettagli`, 9000);
    }
    inviando = false; syncUI(!!ultimoErrore);
  }
  return !ultimoErrore;
}

function syncUI(errore) {
  const b = $('sync');
  b.classList.remove('pend', 'err');
  if (!APPS_SCRIPT_URL) {
    b.textContent = coda.length ? `💾 ${coda.length} locali` : '💾 locale';
    b.title = 'Modalita\' locale: le correzioni restano in questo browser. Clicca per esportarle (JSON).';
    if (coda.length) b.classList.add('pend');
    return;
  }
  if (inviando) { b.textContent = `⟳ invio… (${coda.length})`; return; }
  const nr = ls.get(RIFIUTATE, []).length;
  if (coda.length) { b.textContent = `⚠ ${coda.length} da inviare`; b.classList.add(errore ? 'err' : 'pend'); b.title = (ultimoErrore ? 'Ultimo errore: ' + ultimoErrore + '\n' : '') + 'Clicca per riprovare l\'invio'; }
  else if (nr) { b.textContent = `⚠ ${nr} rifiutate`; b.classList.add('err'); b.title = 'Il foglio ha rifiutato alcune correzioni: clicca per i dettagli'; }
  else { b.textContent = '✔ sincronizzato'; b.title = 'Correzioni salvate sul foglio condiviso. Clicca per ricaricarle.'; }
}

function esportaCoda() {
  const blob = new Blob([JSON.stringify(coda, null, 1)], {type: 'application/json'});
  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: 'correzioni_sedi_' + new Date().toISOString().slice(0, 10) + '.json'});
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------------------------------------------------------------- scheda convalida/modifica

// Stati proponibili nella scheda. Una sede aggiunta a mano resta "Aggiunta a mano" anche
// quando la si riapre per correggerla: senza questa voce il menu ricadeva su
// "Da convalidare" (stato vuoto) e il foglio rifiutava la correzione per dati mancanti.
function statiScheda(s, nuova) {
  if (nuova) return {nuova: STATI.nuova};
  const voci = Object.fromEntries(Object.entries(STATI).filter(([k]) => k !== 'nuova'));
  return s.p.osm_type === 'nuova' ? {nuova: STATI.nuova, ...voci} : voci;
}

function nomeIniziale(s) {
  nomeManuale = !!(s.corr && s.corr.nome);
  return nomeManuale ? s.corr.nome : nomeAuto(s.e.tipo, s.e.comune, s.e.regione);
}
function regioneForm() {
  const sg = $('f_sigla') && $('f_sigla').value;
  return (sg && PROV[sg] && PROV[sg].regione) || (aperta && aperta.e.regione) || '';
}
function aggiornaNome() {
  const b = $('f_nomeauto');
  if (b) b.classList.toggle('on', nomeManuale), b.title = nomeManuale ? 'Nome scritto a mano: clicca per tornare a quello automatico' : 'Nome automatico';
  if (nomeManuale || !$('f_nome')) return;
  $('f_nome').value = nomeAuto($('f_tipo').value, $('f_comune').value.trim(), regioneForm());
}

function svBox(s) {
  return `<div class="sv"><iframe id="svframe" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen
      src="${svSrc(s.lat, s.lon)}" title="Street View"></iframe>
    <div class="svbar"><span class="k">Street View · se è grigio, lì non ci sono foto</span><a id="svlink" target="_blank" rel="noopener" href="${svLink(s.lat, s.lon)}">Apri ↗</a></div></div>`;
}

function optProv(sel) {
  const ks = Object.keys(PROV).sort();
  if (sel && !PROV[sel]) ks.unshift(sel);
  return (sel ? '' : '<option value="">—</option>') + ks.map(k =>
    `<option value="${k}" ${k === sel ? 'selected' : ''}>${k} – ${esc(PROV[k] ? PROV[k].provincia : '?')}</option>`).join('');
}

function chiudiScheda(silenziosa) {
  const s = aperta;
  $('panel').classList.remove('open', 'mini'); $('panel').innerHTML = ''; spostando = false;
  aperta = null;
  map.getContainer().classList.remove('adding');
  chiudiGeo();
  if (s) {
    s.m.dragging && s.m.dragging.disable();
    if (s.p.osm_type === 'nuova' && !s.storia.length) {   // nuova mai salvata: la tolgo
      cluster.removeLayer(s.m); SEDI = SEDI.filter(x => x !== s); PER_CHIAVE.delete(s.chiave);
    } else { applica(s); }
  }
  document.querySelectorAll('.item.sel').forEach(el => el.classList.remove('sel'));
}

function aggiornaPos(lat, lon) {
  $('panel').dataset.lat = lat; $('panel').dataset.lon = lon;
  const el = $('f_pos'); if (el) el.textContent = lat.toFixed(5) + ', ' + lon.toFixed(5);
  marcaModificati();
}

function marcaModificati() {
  const s = aperta; if (!s) return;
  for (const k of CAMPI) { const el = $('f_' + k); if (el) el.classList.toggle('chg', el.value.trim() !== String(s.e[k] ?? '')); }
  const sg = $('f_sigla'); if (sg) sg.classList.toggle('chg', sg.value !== String(s.e.sigla ?? ''));
}

function salva(statoForzato) {
  const s = aperta; if (!s) return;
  const utente = $('f_utente').value.trim();
  if (!utente) { $('f_utente').focus(); toast('Scrivi chi sei prima di salvare'); return; }
  ls.set(UTENTE, utente);
  const lat = +$('panel').dataset.lat, lon = +$('panel').dataset.lon;
  const mosso = Math.abs(lat - s.lat0) > 1e-6 || Math.abs(lon - s.lon0) > 1e-6 || s.p.osm_type === 'nuova';
  const c = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    timestamp: new Date().toISOString(), utente, chiave: s.chiave,
    osm_type: s.p.osm_type, osm_id: String(s.p.osm_id),
    stato: statoForzato || $('f_stato').value || (s.p.osm_type === 'nuova' ? 'nuova' : ''),
    note: $('f_note').value.trim(),
    lat: mosso ? lat.toFixed(6) : '', lon: mosso ? lon.toFixed(6) : '',
    regione: s.e.regione || '', sigla: s.e.sigla || ''
  };
  // salvo solo i campi che differiscono dal dato OSM originale (cosi' un aggiornamento OSM non viene coperto inutilmente)
  for (const k of CAMPI) { const v = $('f_' + k).value.trim(); c[k] = v !== String(s.p[k] ?? '') ? v : ''; }
  // provincia: salvata solo se diversa da quella dei dati (per le sedi nuove: solo se l'hai scelta tu)
  const sg = $('f_sigla').value;
  c.sigla_corretta = sg && sg !== String(s.p.sigla ?? '') ? sg : '';
  if (c.sigla_corretta && PROV[c.sigla_corretta]) { c.sigla = c.sigla_corretta; c.regione = PROV[c.sigla_corretta].regione; }
  c.nome = nomeManuale ? $('f_nome').value.trim() : '';   // vuoto = nome automatico (lo rigenera anche il workflow)
  if (s.p.osm_type === 'nuova' && !$('f_comune').value.trim() && !c.nome) { $('f_comune').focus(); toast('Scrivi il comune: serve per il nome'); return; }
  coda.push(c); ls.set(CODA, coda);
  s.storia.push(c); s.corr = c;
  const tenuta = s;
  chiudiScheda(true);
  applica(tenuta);
  aggiorna(false);
  toast(STATI[c.stato] ? 'Salvato: ' + STATI[c.stato] : 'Salvato');
  invia();
}

$('panel').addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'pclose' || t.id === 'pannulla') return chiudiScheda();
  if (t.id === 'psalva') return salva();
  if (t.dataset.q) {
    if (t.dataset.q === 'convalidata' || t.dataset.q === 'non_vvf' || t.dataset.q === 'chiusa') {
      if (!$('f_utente').value.trim()) { $('f_stato').value = t.dataset.q; $('f_utente').focus(); toast('Scrivi chi sei, poi premi Salva'); return; }
      return salva(t.dataset.q);
    }
    $('f_stato').value = t.dataset.q; $('f_nome').focus(); toast('Correggi i campi e premi Salva');
    return;
  }
  if (t.id === 'f_sposta' || t.id === 'pfatto') return sposta(!spostando);
  if (t.id === 'f_nomeauto') { nomeManuale = false; aggiornaNome(); marcaModificati(); return; }
  if (t.id === 'f_cerca') return cercaDallaScheda();
});

function sposta(on) {
  const s = aperta; if (!s) return;
  spostando = on;
  const b = $('f_sposta'), mob = matchMedia('(max-width:760px)').matches;
  b.classList.toggle('on', on); b.textContent = on ? '✔ Fatto' : '✥ Sposta';
  $('panel').classList.toggle('mini', on && mob);
  if (on) {
    const vai = () => {
      s.m.dragging.enable();
      map.setView(s.m.getLatLng(), Math.max(map.getZoom(), 17), {animate: false});
      if (!mob) map.panBy([$('panel').offsetWidth / 2, 0], {animate: false});   // il pallino non finisce sotto la scheda
    };
    if (!map.hasLayer(s.m)) cluster.zoomToShowLayer(s.m, vai); else vai();
    toast(mob ? 'Trascina il pallino, poi ✔ Fatto' : 'Trascina il pallino nella posizione giusta', 3500);
  } else {
    s.m.dragging && s.m.dragging.disable();
    const lat = +$('panel').dataset.lat, lon = +$('panel').dataset.lon, f = $('svframe');
    if (f) { f.src = svSrc(lat, lon); $('svlink').href = svLink(lat, lon); }
  }
}

// ---------------------------------------------------------------- filtri, elenco, mappa
function filtra() {
  const q = norm(state.q).trim(), off = new Set(state.off);
  return SEDI.filter(s => {
    const e = s.e;
    if (off.has(e.tipo)) return false;
    if (state.reg && e.regione !== state.reg) return false;
    if (state.prov && (e.sigla || 'XX') !== state.prov) return false;
    if (state.noConcl && concluso(e.sigla)) return false;
    if (state.stato === 'scartate') { if (!scartata(s)) return false; }
    else {
      if (scartata(s)) return false;
      if (state.stato === 'da_conv' && s.stato) return false;
      if (state.stato === 'convalidata') { if (!convalidata(s)) return false; }   // stesso criterio del flag nel DB
      else if (state.stato && state.stato !== 'da_conv' && s.stato !== state.stato) return false;
    }
    if (q && !s.txt.includes(q)) return false;
    return true;
  });
}

function opzioniProvince() {
  const sel = $('prov'), conta = {};
  SEDI.forEach(s => { if (!state.reg || s.e.regione === state.reg) { const k = s.e.sigla || 'XX'; (conta[k] ||= {n: 0, nome: s.e.provincia}).n++; } });
  if (state.prov && !conta[state.prov]) state.prov = '';
  sel.innerHTML = '<option value="">Tutte le province</option>' + Object.keys(conta).sort().map(k =>
    `<option value="${k}">${concluso(k) ? '✅ ' : ''}${k === 'XX' ? 'Senza provincia' : k + ' – ' + esc(conta[k].nome)} (${conta[k].n})</option>`).join('');
  sel.value = state.prov;
}

function chips() {
  const conta = {}, off = new Set(state.off);
  let conv = 0, tot = 0;
  SEDI.forEach(s => {
    if (state.reg && s.e.regione !== state.reg) return;
    if (state.prov && (s.e.sigla || 'XX') !== state.prov) return;
    if (scartata(s)) return;
    conta[s.e.tipo] = (conta[s.e.tipo] || 0) + 1; tot++;
    if (convalidata(s)) conv++;
  });
  $('chips').innerHTML = Object.keys(TIPI).filter(t => conta[t]).map(t =>
    `<span class="chip ${off.has(t) ? 'off' : ''}" data-t="${t}"><span class="dot" style="background:${COL[t]}"></span>${TIPI[t]} <small>${conta[t]}</small></span>`).join('') +
    `<span class="sep"></span><span class="chip" data-conv="1" title="Mostra le sedi ancora da convalidare"><span class="st convalidata">✔ ${conv}/${tot}</span> <small>convalidate</small></span>` +
    `<span class="chip concl ${state.noConcl ? 'on' : ''}" data-concl="1" title="Nascondi le sedi dei Comandi già conclusi">🏁 ${nConclusi()} <small>Comandi conclusi · ✅ ${REGIONI.filter(regioneCompleta).length}/${REGIONI.length} regioni${state.noConcl ? ' · nascosti' : ''}</small></span>`;
  bottoneConcluso();
  if (REGIONI.length) opzioniRegioni();
}

function lista() {
  const el = $('list');
  if (!shown.length) { el.innerHTML = '<div class="empty">Nessuna sede con questi filtri.</div>'; return; }
  el.innerHTML = shown.slice(0, limit).map((s, i) =>
    `<div class="item ${aperta === s ? 'sel' : ''}" data-i="${i}"><span class="dot" style="background:${COL[s.e.tipo] || COL.altro}"></span>
      <div><div class="n">${esc(titolo(s.e))}</div><div class="s">${esc(TIPI[s.e.tipo])} · ${esc(luogo(s.e))}</div></div>
      <span class="d">${state.me ? fmtKm(s.dist) + '<br>' : ''}${s.stato ? `<span class="st ${s.stato}">${s.stato === 'convalidata' || s.stato === 'nuova' ? '✔' : s.stato === 'da_correggere' ? '✎' : '✖'}</span>` : ''}</span></div>`).join('') +
    (shown.length > limit ? `<button class="btn more" id="more">Mostra altre ${Math.min(200, shown.length - limit)} di ${shown.length - limit}</button>` : '');
}

function aggiorna(fit) {
  shown = filtra();
  if (state.me) { shown.forEach(s => s.dist = km(state.me[0], state.me[1], s.lat, s.lon)); shown.sort((a, b) => a.dist - b.dist); }

// ---------------------------------------------------------------- ricerca indirizzo (Nominatim / OpenStreetMap)
async function geocodifica(q) {
  const v = map.getBounds();
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=it'
    + `&viewbox=${v.getWest()},${v.getNorth()},${v.getEast()},${v.getSouth()}&bounded=0&q=` + encodeURIComponent(q);
  try {
    const r = await fetch(url, {headers: {'Accept-Language': 'it'}});
    const j = await r.json();
    if (!j.length) toast('Nessun indirizzo trovato: prova con via e comune');
    return j.map(x => {
      const a = x.address || {};
      const iso = a['ISO3166-2-lvl6'] || '';
      const comune = a.city || a.town || a.village || a.municipality || a.hamlet || '';
      const via = [a.road || a.pedestrian || a.square || '', a.house_number || ''].filter(Boolean).join(' ');
      return {lat: +x.lat, lon: +x.lon, comune, via, sigla: /^IT-[A-Z]{2}$/.test(iso) ? iso.slice(3) : '',
        titolo: x.name && x.name !== a.road ? x.name : (via || comune || x.display_name.split(',')[0]),
        dett: x.display_name};
    });
  } catch (e) { toast('Ricerca indirizzo non disponibile'); return []; }
}
function mostraRisultati(ul, ris, scegli) {
  ul.hidden = !ris.length;
  ul.innerHTML = ris.map((r, i) => `<li data-i="${i}">${esc(r.titolo)}<small>${esc(r.dett)}</small></li>`).join('');
  ul.onclick = e => { const li = e.target.closest('li'); if (li) { ul.hidden = true; ul.innerHTML = ''; scegli(ris[+li.dataset.i]); } };
}
// Riempie comune, indirizzo e provincia della scheda aperta (solo con valori trovati).
function compilaIndirizzo(r) {
  if (r.comune && $('f_comune')) $('f_comune').value = r.comune;
  if (r.via && $('f_via')) $('f_via').value = r.via;
  if (r.sigla && PROV[r.sigla] && $('f_sigla')) {
    if (![...$('f_sigla').options].some(o => o.value === r.sigla)) $('f_sigla').innerHTML = optProv(r.sigla);
    $('f_sigla').value = r.sigla;
  }
  aggiornaNome(); marcaModificati();
}
async function cercaDallaScheda() {
  const s = aperta; if (!s) return;
  const q = [$('f_via').value.trim(), $('f_comune').value.trim(), $('f_sigla').value].filter(Boolean).join(', ');
  if (!q) { $('f_via').focus(); toast('Scrivi via e comune'); return; }
  const ris = await geocodifica(q);
  mostraRisultati($('f_ris'), ris, r => {
    s.m.setLatLng([r.lat, r.lon]);

    toast('Posizione aggiornata: controlla e premi Salva');
  });
}

// ---------------------------------------------------------------- comandi conclusi
const concluso = sg => { const c = CONCLUSI.get(sg); return !!c && c.stato === 'convalidata'; };
const nConclusi = () => [...CONCLUSI.keys()].filter(concluso).length;
// Regione completa = conclusi tutti i Comandi provinciali VVF che stanno nella regione
// (db/comandi.json: in Sardegna sono 4, CA NU OR SS, non le 8 province; il Trentino-Alto
// Adige ha BZ e TN). Si calcola, non si salva: riaprendo un Comando la spunta sparisce.
// Se comandi.json non si legge, ripiego sulle province dei dati.
let COMANDI = null;   // [{sigla, regione}] dei soli Comandi provinciali
async function leggiComandi() {
  try {
    const r = await fetch(ROOT + 'db/comandi.json', {cache: 'no-cache'});
    const j = await r.json();
    const lst = Array.isArray(j) ? j : (Object.values(j).find(Array.isArray) || []);
    COMANDI = lst.filter(c => String(c['CHS Comando'] || '').trim() && /^[A-Z]{2}$/.test(String(c.Provincia || '').trim()))
      .map(c => ({sigla: String(c.Provincia).trim(), regione: String(c.Regione || '').trim(), nome: c.Comando}));
    if (!COMANDI.length) COMANDI = null;
  } catch (e) { COMANDI = null; console.warn('comandi.json non letto: uso le province dei dati', e); }
}
const provinceDi = reg => COMANDI
  ? [...new Set(COMANDI.filter(c => (PROV[c.sigla] ? PROV[c.sigla].regione : c.regione) === reg).map(c => c.sigla))].sort()
  : Object.keys(PROV).filter(sg => PROV[sg].regione === reg).sort();
const regioneCompleta = reg => { const pp = provinceDi(reg); return pp.length > 0 && pp.every(concluso); };
let REGIONI = [];
function opzioniRegioni() {
  const sel = $('reg');
  sel.innerHTML = '<option value="">Tutte le regioni</option>' + REGIONI.map(r => {
    const pp = provinceDi(r), n = pp.filter(concluso).length;
    return `<option value="${esc(r)}">${regioneCompleta(r) ? '✅ ' : ''}${esc(r)}${n && n < pp.length ? ` (${n}/${pp.length})` : ''}</option>`;
  }).join('');
  sel.value = state.reg;
}
function bottoneConcluso() {
  const b = $('concl'), sg = state.prov;
  b.classList.toggle('vis', (!!sg && sg !== 'XX') || (!sg && !!state.reg));
  if (!sg) {
    if (!state.reg) return;
    const pp = provinceDi(state.reg), n = pp.filter(concluso).length, ok = regioneCompleta(state.reg);
    b.classList.toggle('fatto', ok);
    b.textContent = ok ? `✅ ${state.reg} completa` : `🏁 ${n}/${pp.length} Comandi`;
    b.title = ok ? 'Tutti i Comandi provinciali della regione sono conclusi'
      : 'Comandi mancanti: ' + pp.filter(x => !concluso(x)).join(', ') + ' · scegli una provincia per concluderla';
    return;
  }
  const c = CONCLUSI.get(sg), fatto = concluso(sg);
  b.classList.toggle('fatto', fatto);
  b.textContent = fatto ? `✅ ${sg} concluso` : `🏁 Concludi ${sg}`;
  b.title = fatto ? `Concluso da ${c.utente || '?'} il ${fmtData(c.timestamp)} · clic per riaprire` : 'Segna il Comando come concluso: tutte le sedi controllate';
}
$('concl').addEventListener('click', () => {
  const sg = state.prov;
  if (!sg && state.reg) { toast($('concl').title, 5000); return; }
  if (!sg || sg === 'XX') return;
  const fatto = concluso(sg);
  const sedi = SEDI.filter(s => (s.e.sigla || 'XX') === sg && !scartata(s));
  const mancano = sedi.filter(s => !s.stato).length;
  const msg = fatto ? `Riaprire il Comando ${sg}? Tornerà tra quelli da completare.`
    : `Segnare il Comando ${sg} come concluso?` + (mancano ? `\n\nAttenzione: ${mancano} sedi su ${sedi.length} sono ancora da convalidare.` : `\n\nTutte le ${sedi.length} sedi sono state controllate.`);
  if (!confirm(msg)) return;

  return r.json();
}), leggiRemote(), leggiComandi()]).then(([g]) => {
  SEDI = g.features.map(f => creaSede(f.properties, f.geometry.coordinates[1], f.geometry.coordinates[0]));
  SEDI.forEach(s => PER_CHIAVE.set(s.chiave, s));
  SEDI.forEach(s => { const p = s.p; if (p.sigla && p.sigla !== 'XX' && !PROV[p.sigla]) PROV[p.sigla] = {provincia: p.provincia, regione: p.regione}; });
  ricalcolaCorrezioni();
  REGIONI = [...new Set(SEDI.map(s => s.e.regione).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'it'));
  if (state.reg && !REGIONI.includes(state.reg)) state.reg = '';
  opzioniRegioni();
  $('reg').value = state.reg; $('q').value = state.q; $('stato').value = state.stato || '';
  opzioniProvince();
  aggiorna(!!(state.reg || state.prov));
  invia();
}).catch(e => {
  console.error(e);
  $('count').textContent = 'errore';
  $('list').innerHTML = `<div class="empty">Impossibile caricare <code>${esc(DATA_URL)}</code><br>${esc(e.message)}<br><br>Se apri il file direttamente dal PC (file://) il browser blocca il caricamento: usa la pagina pubblicata su GitHub Pages.</div>`;
  vista('list');
});
})();
