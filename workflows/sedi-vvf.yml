name: Aggiorna DB sedi VVF

on:
  workflow_dispatch:        # bottone "Run workflow" su GitHub
  schedule:
    - cron: "0 3 1 * *"     # ogni 1 del mese, 03:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica sedi da OSM
        run: python script/sedi.py --out db/sedi
      - name: Commit se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/sedi
          git diff --cached --quiet && echo "Nessuna modifica" && exit 0
          git commit -m "Aggiorna db/sedi (OSM)"
          git push