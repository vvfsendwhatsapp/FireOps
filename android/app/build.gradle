plugins {
    id 'com.android.application'
}

android {
    namespace 'it.vvf.fireops.localizzati'
    compileSdk 34

    defaultConfig {
        applicationId "it.vvf.fireops.localizzati"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionName "2026.10." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    flavorDimensions "versione"
    productFlavors {
        full {
            dimension "versione"
        }
        light {
            dimension "versione"
            applicationIdSuffix ".light"
            versionNameSuffix "-light"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
