<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FireOps VVF</title>
  <link rel="icon" type="image/png" href="https://vvfsendwhatsapp.github.io/FireOps/images/logo.png">
  <link rel="apple-touch-icon" href="https://vvfsendwhatsapp.github.io/FireOps/images/logo.png">
  <meta name="theme-color" content="#10141a">
  <link rel="stylesheet" href="css/fireops-app.css?v=2026.09.26">
</head>

<body>

  <!-- Intestazione comune: resta fissa in alto in tutte le schermate -->
  <div class="foh" role="banner">
    <div class="foh-in">
      <div class="foh-top">
        <img class="foh-logo" id="fohLogo" src="https://vvfsendwhatsapp.github.io/FireOps/images/logo.png"
          alt="Logo VVF" tabindex="0" title="Home">
        <div class="foh-t">
          <h1 id="fohTitolo">FireOps VVF</h1>
          <p id="fohSotto">Sala operativa · funzioni ICS</p>
        </div>
        <a class="foh-home" id="fohHome" href="#/" aria-label="Home" title="Torna alla home" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
            <path d="M9 22V12h6v10" />
          </svg>
        </a>
        <button type="button" class="foh-pfx" id="fohPfx" aria-pressed="true"
          title="Antepone 4146 solo in fase di composizione"><i></i>4146 + 📞</button>
      </div>
      <div class="foh-dial">
        <input type="tel" id="fohInput" placeholder="Componi un numero" inputmode="tel" autocomplete="off"
          aria-label="Numero da comporre">
        <a class="foh-btn foh-call off" id="fohCall" href="javascript:void(0)" aria-label="Chiama" title="Chiama">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <path d="M6 3h4l2 5-2.5 1.5a11 11 0 005 5L16 12l5 2v4a2 2 0 01-2 2C10.6 20 4 13.4 4 5a2 2 0 012-2z"
              stroke="currentColor" stroke-width="2" />
          </svg>
        </a>
        <a class="foh-btn foh-wa off" id="fohWa" href="javascript:void(0)" target="_blank" rel="noopener"
          aria-label="WhatsApp" title="WhatsApp">
          <svg width="19" height="19" viewBox="0 0 24 24">
            <path d="M12 3C7 3 3 6.6 3 11c0 2.1 1 4 2.6 5.4L5 21l4.8-1.8c.7.2 1.4.3 2.2.3 5 0 9-3.6 9-8S17 3 12 3z"
              fill="currentColor" />
          </svg>
        </a>
        <a class="foh-btn foh-tg off" id="fohTg" href="javascript:void(0)" target="_blank" rel="noopener"
          aria-label="Telegram" title="Telegram">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13" />
            <path d="M22 2l-7 20-4-9-9-4z" />
          </svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Home: funzioni ICS -->
  <main id="view-home"></main>

  <!-- Moduli: ognuno viene caricato da js/moduli/<id>.js alla prima apertura e poi resta in memoria -->
  <div id="view-mod" hidden></div>

  <script src="js/fireops-app.js?v=2026.09.26"></script>
</body>

</html>
