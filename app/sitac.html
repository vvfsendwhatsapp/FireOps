<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SITAC · FireOps VVF Pro</title>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <meta name="theme-color" content="#e0a800">
  <link rel="manifest" href="manifest.webmanifest">
  <!--
    SITAC nell'app FireOps VVF Pro, anche senza rete.
    Il markup della SITAC NON è copiato qui: si legge dalla sezione #sitac-aib
    di ../index.html, così resta sempre allineato a sitac.js (se manca un
    pulsante, sitac.js non parte). Il service worker (sw.js) tiene in cache
    questa pagina, index.html, gli script, Leaflet e le tessere della mappa
    già viste: aperta una volta con la rete, funziona anche offline.
    La scheda 3 "SITAC da immagine" (foto con frecce) arriva con lo stesso markup: sitac-foto.js.
  -->
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
  <script>document.write('<script src="js/versione.js?t=' + Date.now() + '"><\/script>');</script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.15.0/dist/leaflet-geoman.css">
  <script>
    var V = window.FIREOPS_VERSIONE || "0";
    document.write('<link rel="stylesheet" href="../style.css?v=' + V + '">');
  </script>
  <style>
    html, body { margin: 0 !important; padding: 0 !important; height: 100%; background: var(--dark-color, #111); }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .ps-testa { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      padding-top: calc(8px + env(safe-area-inset-top)); background: #e0a800; border-bottom: 3px solid #5c4200; color: #241800; }
    .ps-testa a.ps-home { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
      border-radius: 10px; background: #241800; color: #ffd24a; text-decoration: none; font-size: 20px; flex: 0 0 auto; }
    .ps-testa h1 { margin: 0; font-size: 18px; line-height: 1.1; color: #241800; }
    .ps-testa p { margin: 0; font-size: 11.5px; color: #33230a; }
    .ps-tit { flex: 1; min-width: 0; }
    .ps-rete { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 10px; background: #241800; color: #8fe39b; white-space: nowrap; }
    .ps-rete.off { color: #ff8a8a; }
      color: #bbb; border-bottom: 3px solid transparent; cursor: pointer; }
    .ps-corpo { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px; }
    .ps-corpo[hidden] { display: none; }
    /* La SITAC prende tutta l'altezza che resta sotto la testata dell'app */
    #ps-sitac { padding: 8px !important; overflow-x: hidden; }
    #ps-sitac #sitac-aib { display: block !important; max-width: 100%; }
    #ps-sitac #sitac-app { height: calc(100dvh - 110px - env(safe-area-inset-top)); min-height: 420px; }
    #ps-sitac .btn-fullscreen-pagina { display: none !important; }
    #ps-sitac .pagina-box-header { margin-bottom: 8px !important; flex-wrap: wrap; gap: 6px; }
    #ps-sitac .sitac-sez-stretta .pagina-nota-inline { flex-basis: 100%; text-align: left; font-size: 12px; }
    .ps-msg { padding: 20px; color: #ddd; font-size: 15px; }
    .ps-pieno-btn { width: 38px; height: 38px; border-radius: 10px; border: 0; background: #241800; color: #ffd24a; font-size: 20px; cursor: pointer; flex: 0 0 auto; }
    /* Tutto schermo: via la testata dell'app, le bandiere e lo sfondo; restano le schede e la carta */
    #ps-esci { display: none; }
    body.ps-pieno .ps-testa, body.ps-pieno #sitac-aib .pagina-box-header { display: none !important; }
    body.ps-pieno #ps-esci { display: block; position: fixed; top: calc(6px + env(safe-area-inset-top)); right: 6px; z-index: 6000;
      width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ffd24a; background: rgba(36,24,0,.9); color: #ffd24a; font-size: 18px; cursor: pointer; }
    body.ps-pieno #ps-sitac { padding: 4px !important; }
    body.ps-pieno #ps-sitac .sitac-schede { padding-right: 48px; }
    body.ps-pieno #ps-sitac #sitac-app { height: calc(100dvh - 60px - env(safe-area-inset-top)); }
    body.ps-pieno #ps-sitac #sitac-app.sitac-mobile .sitac-mapwrap { height: calc(100dvh - 140px - env(safe-area-inset-top)); }
    body.ps-pieno #ps-sitac #sitac-app.sitac-mobile .sitac-immagine-frame,
    body.ps-pieno #ps-sitac #sitac-app.sitac-mobile .sitac-3d-frame { height: calc(100dvh - 70px - env(safe-area-inset-top)); }

  </style>
</head>

<body>
  <header class="ps-testa">
    <a class="ps-home" href="user.html" title="Torna a FireOps Pro" aria-label="Torna a FireOps Pro">‹</a>
    <div class="ps-tit">
      <h1>SITAC</h1>
      <p id="ps-sotto">Situazione tattica · anche senza rete</p>
    </div>
    <span class="ps-rete" id="ps-rete">online</span>
    <button type="button" class="ps-pieno-btn" id="ps-pieno" title="A tutto schermo" aria-label="A tutto schermo">⛶</button>
  </header>
  <button type="button" id="ps-esci" title="Esci dal tutto schermo" aria-label="Esci dal tutto schermo">✕</button>

  <div class="ps-corpo" id="ps-sitac"><p class="ps-msg">Caricamento della SITAC…</p></div>

  <script>
  (function () {
    "use strict";
    var V = window.FIREOPS_VERSIONE || "0";
    var $ = function (id) { return document.getElementById(id); };

    /* ---------- rete ---------- */
    function rete() { var r = $("ps-rete"); r.textContent = navigator.onLine ? "online" : "offline"; r.classList.toggle("off", !navigator.onLine); }
    window.addEventListener("online", rete); window.addEventListener("offline", rete); rete();

    /* Tutto schermo: si chiede quello vero del telefono e, comunque vada (nell'app
       Android il WebView può rifiutarlo), si toglie tutto quello che non è SITAC. */
    function ridisegnaSitac() {
      setTimeout(function () {
        var i = window.FireOps && FireOps.Sitac && FireOps.Sitac.get && FireOps.Sitac.get(); if (i) i.ridisegna();
        document.querySelectorAll("#ps-sitac iframe").forEach(function (f) {
          try { var w = f.contentWindow; if (w.FireOpsSitacImmagine) w.FireOpsSitacImmagine.ridisegna(); w.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }, 120);
    }
    function pieno(si) {
      document.body.classList.toggle("ps-pieno", si);
      try {
        if (si && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
        if (!si && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
      } catch (e) {}
      ridisegnaSitac();
    }
    $("ps-pieno").onclick = function () { pieno(true); };
    $("ps-esci").onclick = function () { pieno(false); };
    /* uscendo con il tasto indietro del telefono il tutto schermo vero finisce: si esce anche dal nostro */
    document.addEventListener("fullscreenchange", function () { if (!document.fullscreenElement && document.body.classList.contains("ps-pieno")) { document.body.classList.remove("ps-pieno"); ridisegnaSitac(); } });

    /* ---------- script in ordine ---------- */
    function script(src) {
      return new Promise(function (ok, ko) {
        var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = function () { ko(new Error(src)); };
        document.head.appendChild(s);
      });
    }

    /* Comandi: per il Comando afferente della SITAC (provincia del DOS) e per partire dal proprio Comando */
    function caricaComandi() {
      return fetch("../db/comandi.json?v=" + V).then(function (r) { return r.json(); }).then(function (d) {
        var l = Array.isArray(d) ? d : (d && d.comandi) || [];
        window.FireOpsComandi = l;
        var NS = (window.FireOps = window.FireOps || {});
        NS.comandoPerProvincia = function (sigla, nome) {
          var s = String(sigla || "").toUpperCase().replace(/^IT-/, "").trim();
          if (s) { var p = l.find(function (c) { return String(c.Provincia || "").toUpperCase() === s; }); if (p) return p; }
          var n = String(nome || "").toLowerCase().trim(); if (!n) return null;
          return l.find(function (c) { return String(c.Comando || "").toLowerCase() === n || String(c.Comune || "").toLowerCase() === n; }) || null;
        };
        var man = null; try { man = localStorage.getItem("fireops_comando_manuale"); } catch (e) { }
        var norm = function (s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z]/g, ""); };
        if (man) window.FireOpsComandoAttivo = l.find(function (c) { return norm(c.Comando) === norm(man); }) || null;
      }).catch(function () { /* senza comandi: la SITAC parte dal centro d'Italia */ });
    }

    /* Il markup della SITAC si prende da index.html: una sola copia, sempre allineata a sitac.js */
    function caricaMarkup() {
      return fetch("../index.html?v=" + V).then(function (r) { return r.text(); }).then(function (t) {
        var doc = new DOMParser().parseFromString(t, "text/html");
        var sez = doc.getElementById("sitac-aib");
        if (!sez) throw new Error("sezione SITAC non trovata");
        $("ps-sitac").innerHTML = "";
        $("ps-sitac").appendChild(document.importNode(sez, true));
      });
    }

    var CDN = [
      "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js",
      "https://unpkg.com/@geoman-io/leaflet-geoman-free@2.15.0/dist/leaflet-geoman.min.js",
      "https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"
    ];
    var LOCALI = ["../fireops-sfondi.js", "../radiotelefoni.js", "../sitac-simboli.js", "../sitac-vento.js",
      "../sitac-rilievo.js", "../sitac.js", "../sitac-frequenze.js", "../sitac-foto.js", "../sitac-scheda3d.js", "../sitac-mobile.js"];

    Promise.all([caricaComandi(), caricaMarkup()])
      .then(function () { return CDN.reduce(function (p, s) { return p.then(function () { return script(s); }); }, Promise.resolve()); })
      .then(function () { return LOCALI.reduce(function (p, s) { return p.then(function () { return script(s + "?v=" + V); }); }, Promise.resolve()); })
      .then(function () { var i = window.FireOps && FireOps.Sitac && FireOps.Sitac.init(); if (i) i.ridisegna(); })
      .catch(function (e) {
        $("ps-sitac").innerHTML = '<p class="ps-msg">⚠️ La SITAC non si è caricata (' + String(e.message || e) + ').<br>'
          + 'La prima apertura richiede la rete: dopo resta disponibile anche offline.</p>';
      });

  })();
  </script>
</body>

</html>
