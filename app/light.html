<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FireOps VVF Lite</title>
  <link rel="icon" type="image/png" href="../images/icon-light-192.png">
  <link rel="apple-touch-icon" href="../images/icon-light-180.png">
  <meta name="theme-color" content="#29a3e6">
  <link rel="manifest" href="manifest-light.webmanifest">
  <script>if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
  <script>window.FIREOPS_LIGHT = true;</script>
  <!-- versione.js si scarica sempre fresco e decide la versione di tutti gli altri file -->
  <script>document.write('<script src="js/versione.js?t=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<link rel="stylesheet" href="css/fireops-app.css?v=' + (window.FIREOPS_VERSIONE || Date.now()) + '">');</script>
  <style>/* FireOps VVF Lite: intestazione azzurra per distinguerla dall'app completa */
    .foh { background: #29a3e6 !important; border-top: 0 !important; border-bottom: 3px solid #0e3f66 !important; }
    .foh-t h1 { color: #04223a !important; }
    .foh-tg { box-shadow: inset 0 0 0 2px #04223a; }
    .foh-t p { color: #07304f !important; }
    /* riga del comando localizzato: riquadro azzurro scuro che fa risaltare il canale radio giallo */
    .foh-pos { background: #0b3a5e; border-radius: 14px; padding: 5px 6px 5px 10px; gap: 6px; }
    .foh-pos, .foh-pos-cmd { color: #d8efff !important; }
    .foh-pos-cmd b { color: #ffffff; }
    .foh-pos-ch { color: #ffd24a !important; }
    .foh-pos-so { box-shadow: inset 0 0 0 1.5px #7cc8f5; }
    .foh-pos-ref { width: 32px !important; height: 32px !important; }</style>
</head>

<body>

  <!-- Intestazione comune: resta fissa in alto in tutte le schermate -->
  <div class="foh" role="banner">
    <div class="foh-in">
      <div class="foh-top">
        <img class="foh-logo" id="fohLogo" src="https://vvfsendwhatsapp.github.io/FireOps/images/logo.png"
          alt="Logo VVF" tabindex="0" title="Home">
        <div class="foh-t">
          <h1 id="fohTitolo">FireOps VVF Lite</h1>
          <p id="fohSotto">Numeri e percorsi</p>
        </div>
        <a class="foh-home" id="fohHome" href="#/" aria-label="Home" title="Torna alla home" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
            <path d="M9 22V12h6v10" />
          </svg>
        </a>
        <a class="foh-home" id="fohInfo" href="#/utilizzo" aria-label="Info: Comandi su FireOps desktop" title="Info: quali Comandi usano FireOps desktop">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" /><path d="M12 11v6" /><circle cx="12" cy="7.5" r=".6" fill="currentColor" />
          </svg>
        </a>
      </div>
      <!-- Autoposizionamento: comando competente rilevato all'apertura -->
      <div class="foh-pos" id="fohPos" aria-live="polite">
        <span class="foh-pos-dot" id="fohPosDot" aria-hidden="true"></span>
        <a class="foh-pos-cmd" id="fohPosCmd" href="#/localizzati" title="Apri Localizzati">Localizzazione in corso…</a>
        <select class="foh-pos-sel" id="fohPosSel" aria-label="Scegli il comando" hidden>
          <option value="">Scegli il comando…</option>
        </select>
        <span class="foh-pos-ch" id="fohPosCh" hidden></span>
        <a class="foh-pos-so" id="fohPosSo" href="javascript:void(0)" hidden title="Chiama la SO del comando">SO</a>
        <button type="button" class="foh-pos-ref" id="fohPosRef" aria-label="Aggiorna posizione" title="Aggiorna posizione">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8" /><path d="M21 3v5h-5" /></svg>
        </button>
      </div>
      <div class="foh-dial">
        <input type="tel" id="fohInput" placeholder="Componi un numero" inputmode="tel" autocomplete="off"
          aria-label="Numero da comporre">
      </div>
      <div class="foh-acts">
        <a class="foh-btn foh-call off" id="fohCall" href="javascript:void(0)" aria-label="Chiama con 4146" title="Chiama con 4146 davanti"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M6 3h4l2 5-2.5 1.5a11 11 0 005 5L16 12l5 2v4a2 2 0 01-2 2C10.6 20 4 13.4 4 5a2 2 0 012-2z" stroke="currentColor" stroke-width="2" /></svg><span>4146 + n°</span></a>
        <a class="foh-btn foh-call0 off" id="fohCall0" href="javascript:void(0)" aria-label="Chiama senza 4146" title="Chiama senza 4146"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M6 3h4l2 5-2.5 1.5a11 11 0 005 5L16 12l5 2v4a2 2 0 01-2 2C10.6 20 4 13.4 4 5a2 2 0 012-2z" stroke="currentColor" stroke-width="2" /></svg><span>Senza 4146</span></a>
        <a class="foh-btn foh-wa off" id="fohWa" href="javascript:void(0)" target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp"><svg width="19" height="19" viewBox="0 0 24 24"><path d="M12 3C7 3 3 6.6 3 11c0 2.1 1 4 2.6 5.4L5 21l4.8-1.8c.7.2 1.4.3 2.2.3 5 0 9-3.6 9-8S17 3 12 3z" fill="currentColor" /></svg><span>WhatsApp</span></a>
        <a class="foh-btn foh-tg off" id="fohTg" href="javascript:void(0)" target="_blank" rel="noopener" aria-label="Telegram" title="Telegram"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13" /><path d="M22 2l-7 20-4-9-9-4z" /></svg><span>Telegram</span></a>
      </div>
    </div>
  </div>

  <!-- Home: tasti funzione -->
  <main id="view-home"></main>

  <!-- Pagina dei sotto-tasti di una funzione (Misura, PUMA, Co.Em.) -->
  <main id="view-hub" hidden></main>

  <!-- Moduli: ognuno viene caricato da js/moduli/<id>.js alla prima apertura e poi resta in memoria -->
  <div id="view-mod" hidden></div>

  <script>document.write('<script src="../fireops-sfondi.js?v=' + (window.FIREOPS_VERSIONE || Date.now()) + '"><\/script>');</script>
  <script>document.write('<script src="js/fireops-app.js?v=' + (window.FIREOPS_VERSIONE || Date.now()) + '"><\/script>');</script>
</body>

</html>
