<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Localizza Comando VVF</title>
<style>
:root{
  --bg:#10141a;
  --panel:#171d25;
  --panel-2:#1d242e;
  --line:#2a323d;
  --red:#c8202b;
  --red-dim:#5c1216;
  --amber:#e8a33d;
  --text:#eceff3;
  --text-dim:#8b96a3;
  --green:#3fa66b;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:64px;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px;}

/* header */
header{
  padding:20px 16px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
}
.mark{flex:none;width:34px;height:34px;}
.htitle{flex:1;min-width:0;}
.htitle h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.1px;}
.htitle p{margin:2px 0 0;font-size:12.5px;color:var(--text-dim);}

/* sections */
section{margin-top:18px;}
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  overflow:hidden;
}
.panel + .panel{margin-top:10px;}
.row-group-label{
  padding:10px 14px 6px;
  font-size:12.5px;
  color:var(--text-dim);
  border-left:3px solid var(--line);
}
.row-group-label.radio{border-left-color:var(--amber);}
.row-group-label.so{border-left-color:var(--red);}

/* locate button */
.locate-btn{
  width:100%;
  padding:16px;
  font-size:16px;
  font-weight:600;
  color:#fff;
  background:var(--red);
  border:none;
  border-radius:4px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.locate-btn:active{background:var(--red-dim);}
.locate-btn svg{flex:none;}
.locate-btn.loading{opacity:.7;}

.link-btn{
  display:block;
  width:100%;
  text-align:center;
  background:none;
  border:none;
  color:var(--text-dim);
  font-size:13.5px;
  padding:12px 8px 2px;
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:3px;
}
.link-btn:active{color:var(--text);}

.status-msg{
  margin-top:10px;
  font-size:13px;
  color:var(--amber);
  padding:0 2px;
  line-height:1.5;
}
.status-msg.error{color:#e8734a;}

/* result header */
.result-top{
  padding:16px 14px;
  border-left:3px solid var(--green);
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
}
.result-top .name{font-size:24px;font-weight:700;letter-spacing:.2px;}
.result-top .dist{font-family:var(--mono);font-size:15px;color:var(--green);white-space:nowrap;}
.result-sub{padding:0 14px 14px;font-size:13px;color:var(--text-dim);margin-top:-8px;}

/* data rows */
.data-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  border-top:1px solid var(--line);
  min-height:26px;
}
.data-row .label{font-size:14px;color:var(--text-dim);}
.data-row .value{
  font-family:var(--mono);
  font-size:16px;
  display:flex;
  align-items:center;
  gap:8px;
}
a.value-link{color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;}
a.value-link:active{color:var(--amber);}
.copy-btn{
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--text-dim);
  border-radius:4px;
  font-size:11px;
  padding:5px 8px;
  cursor:pointer;
  font-family:var(--sans);
}
.copy-btn:active{border-color:var(--amber);color:var(--amber);}
.copy-btn.copied{color:var(--green);border-color:var(--green);}

.addr-row{padding:12px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--text-dim);line-height:1.6;}
.addr-row a{color:var(--text-dim);}

/* border warning */
.border-note{
  margin-top:10px;
  padding:12px 14px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-left:3px solid var(--amber);
  border-radius:4px;
  font-size:13px;
  color:var(--text-dim);
  line-height:1.55;
}
.border-note strong{color:var(--text);}

.method-badge{
  padding:0 14px 14px;
  margin-top:-6px;
  font-size:12px;
}
.method-badge.geo{color:var(--green);}
.method-badge.dist{color:var(--amber);}
.method-badge.manual{color:var(--text-dim);}

/* confinanti chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 14px;}
.chip{
  font-size:13px;
  padding:7px 12px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:20px;
  color:var(--text);
  cursor:pointer;
}
.chip:active{border-color:var(--amber);}

/* search */
.search-wrap{position:relative;}
input.search-input{
  width:100%;
  padding:14px 14px;
  font-size:16px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  color:var(--text);
  font-family:var(--sans);
}
input.search-input:focus{outline:none;border-color:var(--amber);}
.search-results{
  margin-top:6px;
  border:1px solid var(--line);
  border-radius:4px;
  overflow:hidden;
  max-height:280px;
  overflow-y:auto;
}
.search-item{
  padding:12px 14px;
  border-top:1px solid var(--line);
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.search-item:first-child{border-top:none;}
.search-item:active{background:var(--panel-2);}
.search-item .sname{font-size:15px;}
.search-item .sprov{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);}

/* footer national numbers */
footer{
  position:fixed;
  left:0;right:0;bottom:0;
  background:var(--panel);
  border-top:1px solid var(--line);
  padding:9px 16px;
  display:flex;
  gap:0;
}
footer .fitem{
  flex:1;
  text-align:center;
  color:var(--text-dim);
  text-decoration:none;
  font-size:12px;
  line-height:1.4;
  padding:4px 6px;
}
footer .fitem b{display:block;color:var(--text);font-family:var(--mono);font-size:14px;font-weight:600;}
footer .fitem + .fitem{border-left:1px solid var(--line);}

.hidden{display:none !important;}
.section-title{font-size:12.5px;color:var(--text-dim);padding:0 2px 8px;}
</style>
</head>

    </div>

  <div class="panel">

    <div class="data-row">

  </div>

  <div class="panel">

  <div class="border-note hidden" id="borderNote"></div>

    <div class="chips" id="confinantiChips"></div>
  </div>

  <button class="link-btn" id="backToSearchBtn">cerca un altro comando</button>
</section>

</div>

function norm(s){
  return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function telHref(num){
  return "tel:"+ (num||"").replace(/[^0-9+]/g,"");
}

async function reverseGeocodeProvincia(lat, lon){
  try{
    const url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+lat+"&lon="+lon+"&addressdetails=1&accept-language=it&zoom=8";
    const resp = await fetch(url, {headers:{"Accept":"application/json"}});
    if(!resp.ok) throw new Error("http "+resp.status);
    const data = await resp.json();
    const addr = data.address || {};

    let provCode = null;
    if(addr["ISO3166-2-lvl6"]){
      provCode = addr["ISO3166-2-lvl6"].split("-").pop().toUpperCase();
    }
    let rec = provCode ? COMANDI.find(r => r.pr === provCode) : null;

    if(!rec && addr.county){
      const countyName = norm(addr.county.replace(/^(provincia di|libera consortile di|libero consorzio( comunale)? di|citt[aà] metropolitana di)\s*/i, ""));
      rec = COMANDI.find(r => norm(r.cm) === countyName || norm(r.c) === countyName);
    }
    return rec || null;
  } catch(e){
    return null;
  }
}

function showResult(record, distanceKm, nearbyList, method){
  document.getElementById("locate-section").classList.add("hidden");
  document.getElementById("search-section").classList.add("hidden");
  const rs = document.getElementById("result-section");
  rs.classList.remove("hidden");

  document.getElementById("rComando").textContent = record.c;
  document.getElementById("rDist").textContent = (distanceKm!=null) ? distanceKm.toFixed(1)+" km" : "";
  document.getElementById("rSub").textContent = record.rg + " · Direzione regionale " + record.dz;

  document.getElementById("rRadioComando").textContent = record.rc || "—";
  document.getElementById("rRadioDirezione").textContent = record.rd || "—";

  const tsc = document.getElementById("rTelComandoWrap");
  tsc.innerHTML = record.tsc
    ? '<a class="value-link" href="'+telHref(record.tsc)+'">'+record.tsc+' <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 3h4l2 5-2.5 1.5a11 11 0 005 5L16 12l5 2v4a2 2 0 01-2 2C10.6 20 4 13.4 4 5a2 2 0 012-2z" stroke="currentColor" stroke-width="1.6"/></svg></a>'
    : "—";
  const tsd = document.getElementById("rTelDirezioneWrap");
  tsd.innerHTML = record.tsd
    ? '<a class="value-link" href="'+telHref(record.tsd)+'">'+record.tsd+' <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 3h4l2 5-2.5 1.5a11 11 0 005 5L16 12l5 2v4a2 2 0 01-2 2C10.6 20 4 13.4 4 5a2 2 0 012-2z" stroke="currentColor" stroke-width="1.6"/></svg></a>'
    : "—";

  let addr = record.ind || "";
  let extra = [];
  if(record.nue) extra.push("NUE " + record.nue);
  if(record.tc) extra.push("Centralino " + record.tc);
  document.getElementById("rAddr").innerHTML = addr + (extra.length ? "<br>" + extra.join(" · ") : "");

  const methodEl = document.getElementById("rMethod");
  const borderNote = document.getElementById("borderNote");
  if(method === "geo"){
    methodEl.className = "method-badge geo";
    methodEl.textContent = "Determinato dalla provincia di competenza";
    borderNote.classList.add("hidden");
  } else if(method === "dist"){
    methodEl.className = "method-badge dist";
    methodEl.textContent = "Stima per vicinanza — provincia non determinabile via rete";
    borderNote.classList.remove("hidden");
    borderNote.innerHTML = "Non è stato possibile determinare la provincia via rete: mostrato il comando con sede più vicina. Verifica la competenza effettiva, specie vicino a un confine provinciale.";
  } else {
    methodEl.className = "method-badge manual";
    methodEl.textContent = "";
    borderNote.classList.add("hidden");
  }

  const confPanel = document.getElementById("confinantiPanel");
  const chips = document.getElementById("confinantiChips");
  chips.innerHTML = "";
  if(record.conf && record.conf.length){
    confPanel.classList.remove("hidden");
    record.conf.forEach(name=>{
      const rec = COMANDI.find(x=>x.c===name);
      if(!rec) return;
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = name;
      chip.onclick = ()=> selectComando(rec, userPos);
      chips.appendChild(chip);
    });
  } else {
    confPanel.classList.add("hidden");
  }

  window.scrollTo({top:0, behavior:"smooth"});
}

let userPos = null;

function selectComando(record, pos){
  let dist = null;
  if(pos){
    dist = haversine(pos.lat, pos.lon, record.lat, record.lon);
  }
  showResult(record, dist, null, "manual");
}

document.getElementById("locateBtn").addEventListener("click", function(){
  const btn = this;
  const statusEl = document.getElementById("statusMsg");
  statusEl.classList.remove("hidden","error");
  statusEl.textContent = "Localizzazione in corso...";
  btn.classList.add("loading");

  if(!navigator.geolocation){
    statusEl.classList.add("error");
    statusEl.textContent = "Il dispositivo non supporta la geolocalizzazione. Cerca il comando manualmente.";
    btn.classList.remove("loading");
    return;
  }

  navigator.geolocation.getCurrentPosition(async function(pos){
    userPos = {lat: pos.coords.latitude, lon: pos.coords.longitude};
    statusEl.textContent = "Determinazione provincia di competenza...";

    const geoRec = await reverseGeocodeProvincia(userPos.lat, userPos.lon);
    btn.classList.remove("loading");
    statusEl.classList.add("hidden");

    if(geoRec){
      const dist = haversine(userPos.lat, userPos.lon, geoRec.lat, geoRec.lon);
      showResult(geoRec, dist, null, "geo");
    } else {
      const withDist = COMANDI.map(r=>({rec:r, dist:haversine(userPos.lat,userPos.lon,r.lat,r.lon)}))
        .sort((a,b)=>a.dist-b.dist);
      showResult(withDist[0].rec, withDist[0].dist, withDist.slice(1), "dist");
    }
  }, function(err){
    btn.classList.remove("loading");
    statusEl.classList.add("error");
    if(err.code === 1) statusEl.textContent = "Permesso posizione negato. Cerca il comando manualmente.";
    else if(err.code === 2) statusEl.textContent = "Posizione non disponibile. Cerca il comando manualmente.";
    else statusEl.textContent = "Localizzazione non riuscita. Cerca il comando manualmente.";
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
});

document.getElementById("toggleSearchBtn").addEventListener("click", function(){
  document.getElementById("search-section").classList.remove("hidden");
  document.getElementById("searchInput").focus();
});

document.getElementById("backToSearchBtn").addEventListener("click", function(){
  document.getElementById("result-section").classList.add("hidden");
  document.getElementById("locate-section").classList.remove("hidden");
  document.getElementById("search-section").classList.remove("hidden");
  document.getElementById("searchInput").focus();
});

const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
searchInput.addEventListener("input", function(){
  const q = norm(this.value);
  if(q.length < 2){ searchResults.classList.add("hidden"); searchResults.innerHTML=""; return; }
  const matches = COMANDI.filter(r => norm(r.c).includes(q) || norm(r.cm).includes(q) || norm(r.pr).includes(q)).slice(0,8);
  searchResults.innerHTML = "";
  if(!matches.length){ searchResults.classList.add("hidden"); return; }
  searchResults.classList.remove("hidden");
  matches.forEach(rec=>{
    const item = document.createElement("div");
    item.className = "search-item";
    item.innerHTML = '<span class="sname">'+rec.c+'</span><span class="sprov">'+rec.pr+' · '+rec.rg+'</span>';
    item.onclick = ()=>{ selectComando(rec, userPos); searchResults.classList.add("hidden"); searchInput.value=""; };
    searchResults.appendChild(item);
  });
});

document.querySelectorAll(".copy-btn").forEach(btn=>{
  btn.addEventListener("click", function(){
    const target = document.getElementById(this.dataset.copyTarget);
    const text = target.textContent;
    const done = ()=>{
      this.textContent = "copiato";
      this.classList.add("copied");
      setTimeout(()=>{ this.textContent = "copia"; this.classList.remove("copied"); }, 1500);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(done);
    } else {
      done();
    }
  });
});
