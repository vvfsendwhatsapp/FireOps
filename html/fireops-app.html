<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FireOps VVF</title>
  <link rel="icon" type="image/png" href="https://vvfsendwhatsapp.github.io/FireOps/images/logo.png">
  <link rel="apple-touch-icon" href="https://vvfsendwhatsapp.github.io/FireOps/images/logo.png">
  <meta name="theme-color" content="#10141a">
  <style>
    :root {
      --bg: #10141a;
      --panel: #171d25;
      --panel-2: #1d242e;
      --line: #2a323d;
      --text: #eceff3;
      --text-dim: #8b96a3;
      --prefix: #ffd700;
      --wa: #25d366;
      --tg: #29a9eb;

      /* Colori funzioni ICS */
      --ics-comando: #8d96a1;
      --ics-operazioni: #d8262f;
      --ics-pianificazione: #2f9e5b;
      --ics-logistica: #f2c200;
      --ics-amministrazione: #2b73d6;

      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    }

    /* ---------- Barra fissa in alto: intestazione + componi ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding-top: env(safe-area-inset-top, 0px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .35);
    }

    .topbar-inner {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px 16px 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      flex: none;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      flex: 1;
    }

    .prefix-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 20px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .prefix-toggle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .prefix-toggle[aria-pressed="true"] {
      background: var(--prefix);
      border-color: var(--prefix);
      color: #000;
    }

    .prefix-toggle[aria-pressed="true"] .prefix-toggle-dot { background: #000; }

    .dial {
      display: flex;
      gap: 6px;
    }

    .dial input {
      flex: 1;
      min-width: 0;
      padding: 12px 12px;
      font-size: 17px;
      font-family: var(--mono);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
    }

    .dial input:focus {
      outline: none;
      border-color: var(--prefix);
    }

    .dial-btn {
      flex: none;
      width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      text-decoration: none;
      color: #fff;
    }

    .dial-btn.call { background: var(--prefix); color: #000; }
    .dial-btn.wa { background: var(--wa); }
    .dial-btn.tg { background: var(--tg); }

    .dial-btn.disabled {
      opacity: .3;
      pointer-events: none;
    }

    .dial-btn:active { opacity: .8; }

    .dial-btn:focus-visible,
    .prefix-toggle:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    /* ---------- Sezioni ICS ---------- */
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 16px 0;
    }

    .ics {
      margin-bottom: 10px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .ics-head {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0;
      background: none;
      border: none;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font-family: inherit;
    }

    /* il blocco colorato è l'elemento che identifica la funzione */
    .ics-swatch {
      flex: none;
      width: 64px;
      align-self: stretch;
      min-height: 68px;
      background: var(--c);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--on-c, #fff);
      font-size: 22px;
      font-weight: 800;
    }

    .ics-text {
      flex: 1;
      min-width: 0;
      padding: 14px 0;
    }

    .ics-name {
      display: block;
      font-size: 18px;
      font-weight: 700;
    }

    .ics-sub {
      display: block;
      margin-top: 2px;
      font-size: 12.5px;
      color: var(--text-dim);
    }

    .ics-chev {
      flex: none;
      margin-right: 16px;
      color: var(--text-dim);
      transition: transform .18s ease;
    }

    .ics.open .ics-chev { transform: rotate(90deg); }

    .ics.open {
      border-color: var(--c);
    }

    .ics-head:focus-visible {
      outline: 2px solid var(--c);
      outline-offset: -2px;
    }

    .ics-body {
      display: none;
      border-top: 1px solid var(--line);
      padding: 8px;
    }

    .ics.open .ics-body { display: block; }

    .mod {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
    }

    .mod + .mod { border-top: 1px solid var(--line); border-radius: 0; }

    .mod:active, .mod:hover { background: var(--panel-2); }

    .mod:focus-visible {
      outline: 2px solid var(--c);
      outline-offset: -2px;
    }

    .mod-ico {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .mod-text { flex: 1; min-width: 0; }

    .mod-name {
      display: block;
      font-size: 15.5px;
      font-weight: 600;
    }

    .mod-desc {
      display: block;
      margin-top: 2px;
      font-size: 12.5px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .empty {
      padding: 14px 12px;
      font-size: 13px;
      color: var(--text-dim);
    }

    @media (prefers-reduced-motion: reduce) {
      .ics-chev { transition: none; }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="https://vvfsendwhatsapp.github.io/FireOps/images/logo.png" alt="Logo VVF">
        <h1>FireOps VVF</h1>
        <button type="button" id="prefixToggle" class="prefix-toggle" aria-pressed="true"
          title="Antepone 4146 solo in fase di composizione">
          <span class="prefix-toggle-dot"></span>4146
        </button>
      </div>

      <div class="dial">
        <input type="tel" id="dialInput" placeholder="Componi un numero" inputmode="tel" autocomplete="off"
          aria-label="Numero da comporre">
        <a id="dialCall" class="dial-btn call disabled" href="javascript:void(0)" aria-label="Chiama" title="Chiama">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M6 3h4l2 5-2.5 1.5a11 11 0 005 5L16 12l5 2v4a2 2 0 01-2 2C10.6 20 4 13.4 4 5a2 2 0 012-2z"
              stroke="currentColor" stroke-width="2" />
          </svg>
        </a>
        <a id="dialWa" class="dial-btn wa disabled" href="javascript:void(0)" target="_blank" rel="noopener"
          aria-label="WhatsApp" title="WhatsApp">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M12 3C7 3 3 6.6 3 11c0 2.1 1 4 2.6 5.4L5 21l4.8-1.8c.7.2 1.4.3 2.2.3 5 0 9-3.6 9-8S17 3 12 3z"
              fill="currentColor" />
          </svg>
        </a>
        <a id="dialTg" class="dial-btn tg disabled" href="javascript:void(0)" target="_blank" rel="noopener"
          aria-label="Telegram" title="Telegram">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13" />
            <path d="M22 2l-7 20-4-9-9-4z" />
          </svg>
        </a>
      </div>
    </div>
  </div>

  <main id="sezioni"></main>

  <script>
    // ---- Funzioni ICS e moduli: per aggiungere un modulo basta una riga in "moduli" ----
    const SEZIONI = [
      {
        id: "comando", nome: "Comando", sigla: "C", colore: "var(--ics-comando)", testo: "#10141a",
        sub: "Direzione e coordinamento",
        moduli: []
      },
      {
        id: "operazioni", nome: "Operazioni", sigla: "O", colore: "var(--ics-operazioni)", testo: "#fff",
        sub: "Gestione dell'intervento",
        moduli: []
      },
      {
        id: "pianificazione", nome: "Pianificazione", sigla: "P", colore: "var(--ics-pianificazione)", testo: "#fff",
        sub: "Situazione, posizione e risorse",
        moduli: [
          {nome: "Localizzati", desc: "Comando competente, canali radio e numeri SO dalla posizione", href: "FireOps_Localizzati.html", ico: "📍"}
        ]
      },
      {
        id: "logistica", nome: "Logistica", sigla: "L", colore: "var(--ics-logistica)", testo: "#10141a",
        sub: "Mezzi, materiali e supporto",
        moduli: []
      },
      {
        id: "amministrazione", nome: "Amministrazione", sigla: "A", colore: "var(--ics-amministrazione)", testo: "#fff",
        sub: "Pratiche e comunicazioni del personale",
        moduli: [
          {nome: "Comunicazioni", desc: "Missioni per soccorso e mancate timbrature via email", href: "FireOps_Comunicazioni.html", ico: "✉️"}
        ]
      }
    ];

    const CHEVRON = '<svg class="ics-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

    const cont = document.getElementById("sezioni");

    function leggiAperta() {
      try { return localStorage.getItem("fireops_home_sezione"); } catch (e) { return null; }
    }
    function salvaAperta(id) {
      try { id ? localStorage.setItem("fireops_home_sezione", id) : localStorage.removeItem("fireops_home_sezione"); } catch (e) { }
    }

    SEZIONI.forEach(s => {
      const box = document.createElement("section");
      box.className = "ics";
      box.id = "ics-" + s.id;
      box.style.setProperty("--c", s.colore);
      box.style.setProperty("--on-c", s.testo);

      const n = s.moduli.length;
      const head = document.createElement("button");
      head.type = "button";
      head.className = "ics-head";
      head.setAttribute("aria-expanded", "false");
      head.setAttribute("aria-controls", "body-" + s.id);
      head.innerHTML =
        '<span class="ics-swatch" aria-hidden="true">' + s.sigla + '</span>' +
        '<span class="ics-text"><span class="ics-name">' + s.nome + '</span>' +
        '<span class="ics-sub">' + s.sub + ' · ' + (n === 1 ? "1 modulo" : n + " moduli") + '</span></span>' +
        CHEVRON;

      const body = document.createElement("div");
      body.className = "ics-body";
      body.id = "body-" + s.id;

      if (n) {
        s.moduli.forEach(m => {
          const a = document.createElement("a");
          a.className = "mod";
          a.href = m.href;
          a.innerHTML =
            '<span class="mod-ico" aria-hidden="true">' + (m.ico || "•") + '</span>' +
            '<span class="mod-text"><span class="mod-name">' + m.nome + '</span>' +
            (m.desc ? '<span class="mod-desc">' + m.desc + '</span>' : '') + '</span>';
          body.appendChild(a);
        });
      } else {
        body.innerHTML = '<div class="empty">Nessun modulo in questa funzione per ora.</div>';
      }

      head.addEventListener("click", () => {
        const apri = !box.classList.contains("open");
        document.querySelectorAll(".ics.open").forEach(x => {
          x.classList.remove("open");
          x.querySelector(".ics-head").setAttribute("aria-expanded", "false");
        });
        if (apri) {
          box.classList.add("open");
          head.setAttribute("aria-expanded", "true");
        }
        salvaAperta(apri ? s.id : null);
      });

      box.append(head, body);
      cont.appendChild(box);
    });

    // riapre l'ultima funzione usata
    const ultima = leggiAperta();
    if (ultima && document.getElementById("ics-" + ultima)) {
      document.querySelector("#ics-" + ultima + " .ics-head").click();
    }

    // ---- Componi: stessa logica di Localizzati ----
    const DIAL_PREFIX = "41460039";
    let prefisso = true;
    try { prefisso = localStorage.getItem("fireops_prefix") !== "0"; } catch (e) { }

    const dialInput = document.getElementById("dialInput");
    const prefixBtn = document.getElementById("prefixToggle");

    function soloCifre(v) { return (v || "").toString().replace(/[^0-9]/g, ""); }
    function normalizzaIT(d) {
      if (d.startsWith("0039")) return d.slice(4);
      if (d.startsWith("39") && d.length >= 11) return d.slice(2);
      return d;
    }

    function aggiornaDial() {
      const d = soloCifre(dialInput.value);
      const ok = d.length > 0;
      const naz = normalizzaIT(d);

      const call = document.getElementById("dialCall");
      call.href = ok ? "tel:" + (prefisso ? DIAL_PREFIX + naz : d) : "javascript:void(0)";
      call.classList.toggle("disabled", !ok);

      const wa = document.getElementById("dialWa");
      wa.href = ok ? "https://wa.me/39" + naz : "javascript:void(0)";
      wa.classList.toggle("disabled", !ok);

      const tg = document.getElementById("dialTg");
      tg.href = ok ? "https://t.me/+39" + naz : "javascript:void(0)";
      tg.classList.toggle("disabled", !ok);
    }

    prefixBtn.setAttribute("aria-pressed", prefisso ? "true" : "false");
    prefixBtn.addEventListener("click", () => {
      prefisso = !prefisso;
      prefixBtn.setAttribute("aria-pressed", prefisso ? "true" : "false");
      try { localStorage.setItem("fireops_prefix", prefisso ? "1" : "0"); } catch (e) { }
      aggiornaDial();
    });

    dialInput.addEventListener("input", aggiornaDial);
    aggiornaDial();
  </script>
</body>

</html>
